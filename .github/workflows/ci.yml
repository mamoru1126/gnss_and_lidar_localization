name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # 地図のライブラリ tiled_pcd_map を単体でビルド・テストする（small_gicp なし）。インストールしたものを
  # find_package で使う例（tiled_pcd_map/examples/follow_path）もビルドする
  tiled_pcd_map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libeigen3-dev libgeographiclib-dev libgtest-dev libyaml-cpp-dev
      - name: Build and test
        run: |
          cmake -S tiled_pcd_map -B build_map -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/install_map
          cmake --build build_map -j
          ctest --test-dir build_map --output-on-failure
          cmake --install build_map
      - name: Build the example against the installed tiled_pcd_map
        run: |
          cmake -S tiled_pcd_map/examples/follow_path -B build_example -G Ninja -DCMAKE_PREFIX_PATH=$PWD/install_map
          cmake --build build_example

  # ROS なしでコア単体をビルド・テストする（ROS 依存が紛れ込んでいないことの確認を兼ねる）。
  # tiled_pcd_map は core/CMakeLists.txt が tiled_pcd_map/ を一緒にビルドする
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libeigen3-dev libgeographiclib-dev libgtest-dev libyaml-cpp-dev
      - name: Install small_gicp (v1.0.1)
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/koide3/small_gicp.git /tmp/small_gicp
          cmake -S /tmp/small_gicp -B /tmp/small_gicp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_HELPER=ON -DBUILD_WITH_OPENMP=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/small_gicp/build
          sudo cmake --install /tmp/small_gicp/build
      - name: Build
        run: |
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLL_BUILD_TESTS=ON
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Docker の dev ステージの中で colcon ビルド・テストする（ROS 2 Jazzy）
  ros2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build dev image
        run: docker build -f docker/Dockerfile --target dev -t gll:dev .
      - name: colcon build and test
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws/src/gnss_and_lidar_localization" gll:dev \
            bash -c "source /opt/ros/jazzy/setup.bash && cd /ws && \
                     colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release && \
                     colcon test --event-handlers console_direct+ && \
                     colcon test-result --verbose"
      - name: Tile demo rosbag (make_bag.py) plays in ROS 2
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws/src/gnss_and_lidar_localization" gll:dev \
            bash -c "source /opt/ros/jazzy/setup.bash && cd /ws && \
                     colcon build --event-handlers console_direct+ --packages-select tiled_pcd_map && \
                     source install/setup.bash && \
                     src/gnss_and_lidar_localization/tools/tile_demo/test/run_bag_check.sh"
      - name: GrandTour tools work in the dev image, and their bag / map work with ROS 2 and tiled_pcd_map_tiler
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws/src/gnss_and_lidar_localization" gll:dev \
            bash -c "source /opt/ros/jazzy/setup.bash && cd /ws && \
                     colcon build --event-handlers console_direct+ --packages-select tiled_pcd_map && \
                     source install/setup.bash && \
                     src/gnss_and_lidar_localization/tools/grandtour/test/run_tests.sh"

  # tools/grandtour（GrandTour のダウンロード・事前確認）を、合成ミッションで確かめる
  tools_grandtour:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy matplotlib "zarr>=3.0.7,<4" pyproj
      - name: Test
        run: tools/grandtour/test/run_tests.sh

  # VS Code の Dev Container（.devcontainer/）を、VS Code と同じ仕組みの devcontainer CLI で起動し、中でビルド・テストする
  devcontainer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start the dev container (postCreateCommand runs the first colcon build)
        run: .github/scripts/annotate_on_fail.sh "devcontainer up" npx -y @devcontainers/cli@0 up --workspace-folder .
      - name: Test inside, as the non-root user
        run: |
          .github/scripts/annotate_on_fail.sh "test in devcontainer" npx -y @devcontainers/cli@0 exec --workspace-folder . bash -c '
            set -e
            source /opt/ros/jazzy/setup.bash && source /ws/install/setup.bash
            echo "user: $(id -un) uid=$(id -u)"; test "$(id -un)" = ubuntu
            test -s /ws/build/compile_commands.json
            ros2 pkg list | grep -x gll_ros2
            cd /ws && colcon test --event-handlers console_direct+ && colcon test-result --verbose
            touch /ws/src/gnss_and_lidar_localization/.devcontainer_owner_check'
      - name: Files created in the container belong to the host user
        run: |
          test "$(stat -c %u .devcontainer_owner_check)" = "$(id -u)"
          rm .devcontainer_owner_check
