name: CI

on:
  push:
    branches: ["**"]
    # 文書だけの変更では動かさない（GitHub Pages の公開は別のワークフロー）
    paths-ignore: ["docs/**", "**/*.md", "tools/awsim/log/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "tools/awsim/log/**"]

# 同じブランチに続けて push したら、前の実行は止める（main は止めない）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 地図のライブラリ tiled_pcd_map を単体でビルド・テストする（small_gicp なし）。インストールしたものを
  # find_package で使う例（tiled_pcd_map/examples/follow_path）もビルドする
  tiled_pcd_map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libeigen3-dev libgeographiclib-dev libgtest-dev libyaml-cpp-dev
      - name: Build and test
        run: |
          cmake -S tiled_pcd_map -B build_map -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/install_map
          cmake --build build_map -j
          ctest --test-dir build_map --output-on-failure
          cmake --install build_map
      - name: Build the example against the installed tiled_pcd_map
        run: |
          cmake -S tiled_pcd_map/examples/follow_path -B build_example -G Ninja -DCMAKE_PREFIX_PATH=$PWD/install_map
          cmake --build build_example

  # ROS なしでコア単体をビルド・テストする（ROS 依存が紛れ込んでいないことの確認を兼ねる）。
  # tiled_pcd_map は core/CMakeLists.txt が tiled_pcd_map/ を一緒にビルドする
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libeigen3-dev libgeographiclib-dev libgtest-dev libyaml-cpp-dev
      - name: Install small_gicp (v1.0.1)
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/koide3/small_gicp.git /tmp/small_gicp
          cmake -S /tmp/small_gicp -B /tmp/small_gicp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_HELPER=ON -DBUILD_WITH_OPENMP=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/small_gicp/build
          sudo cmake --install /tmp/small_gicp/build
      - name: Build
        run: |
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLL_BUILD_TESTS=ON
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Docker の dev ステージの中で colcon ビルド・テストする（ROS 2 Jazzy）。
  # イメージの層は GitHub Actions のキャッシュに置き、Dockerfile が変わらなければ作り直さない（キャッシュはブランチごと。
  # 新しいブランチの最初の実行は main のキャッシュを使う）。
  # 1 つのコンテナを動かしたままにして、colcon build は最初の 1 回だけにする（後のステップはその結果を使う）
  ros2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: gll:dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
      - name: Start the container
        run: |
          docker run -d --name ws -v "${{ github.workspace }}:/ws/src/gnss_and_lidar_localization" gll:dev sleep infinity
      - name: colcon build and test
        run: |
          docker exec ws bash -c "source /opt/ros/jazzy/setup.bash && cd /ws && \
                     colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release && \
                     colcon test --event-handlers console_direct+ && \
                     colcon test-result --verbose"
      - name: Tile demo rosbag (make_bag.py) plays in ROS 2
        run: |
          docker exec ws bash -c "source /opt/ros/jazzy/setup.bash && cd /ws && source install/setup.bash && \
                     src/gnss_and_lidar_localization/tools/tile_demo/test/run_bag_check.sh"
      - name: GrandTour tools work in the dev image, and their bag / map work with ROS 2 and tiled_pcd_map_tiler
        run: |
          docker exec ws bash -c "source /opt/ros/jazzy/setup.bash && cd /ws && source install/setup.bash && \
                     GLL_REQUIRE_ROS=1 src/gnss_and_lidar_localization/tools/grandtour/test/run_tests.sh"
      - name: AWSIM tools - converted bag works with ROS 2 and the localizer tracks the ground truth
        timeout-minutes: 15
        run: |
          docker exec ws bash -c "source /opt/ros/jazzy/setup.bash && cd /ws && source install/setup.bash && \
                     src/gnss_and_lidar_localization/tools/awsim/test/run_localizer_check.sh"

  # tools/awsim（AWSIM の bag の変換・走行・評価）を、合成の bag で確かめる
  tools_awsim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pyyaml pyproj
      - name: Test
        run: tools/awsim/test/run_tests.sh

  # AWSIM と一緒に使う ROS 2 Humble のコンテナ（docker/awsim/Dockerfile）で、記録と走行の道具を確かめる
  awsim_humble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the Humble image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/awsim/Dockerfile
          tags: gll:awsim-humble
          load: true
          cache-from: type=gha,scope=awsim-humble
          cache-to: type=gha,scope=awsim-humble,mode=max
      - name: Record and drive with a stand-in for the AWSIM vehicle
        timeout-minutes: 10
        run: |
          # AWSIM の Quick start demo と同じく、ループバックでマルチキャストを使えるようにする（CycloneDDS の検出のため）
          sudo ip link set lo multicast on
          # 止まったときも出力が残るように、ホストのファイルにも書く（次のステップが注釈に出す）
          set -o pipefail
          timeout 480 docker run --rm --net=host --ipc=host --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/ws/src/gnss_and_lidar_localization" \
            gll:awsim-humble bash tools/awsim/test/run_humble_check.sh 2>&1 | tee /tmp/humble_check.log
      - name: Show the output of the check when it failed
        if: failure()
        run: |
          msg="$(tail -n 80 /tmp/humble_check.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=awsim_humble output (last lines)::$msg"

  # tools/grandtour（GrandTour のダウンロード・事前確認）を、合成ミッションで確かめる
  tools_grandtour:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy matplotlib "zarr>=3.0.7,<4" pyproj
      - name: Test
        run: tools/grandtour/test/run_tests.sh
